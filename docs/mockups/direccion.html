  crea: ["＋","bg-zinc-100 text-ink-muted"], cambio: ["✎","bg-zinc-100 text-ink-muted"], adjunto: ["⧉","bg-zinc-100 text-ink-muted"],
  envio: ["➜","bg-brand-50 text-brand-700"], revision: ["✓","bg-violet-50 text-violet-700"], comentario: ["💬","bg-sky-50 text-sky-700"],
  devuelto: ["↩","bg-red-50 text-red-700"], aprobado: ["✓","bg-emerald-50 text-emerald-700"], reenvio: ["➜","bg-brand-50 text-brand-700"],
};

function alertaHtml(a) {
  if (!a) return "";
  const c = a[0] === "bad" ? "bg-red-50 border-red-200 text-red-800" : "bg-amber-50 border-amber-200 text-amber-900";
  return `<div class="rounded-xl border ${c} px-3.5 py-2.5 text-[12.5px] leading-snug flex gap-2"><span>${a[0] === "bad" ? "⛔" : "⚠️"}</span><span>${a[1]}</span></div>`;
}

function tarjeta(d, compacto) {
  const t = TIPOS[d.tipo];
  const revisado = d.nivel === "doble" && d.estado === "revisado";
  return `<div class="card space-y-1.5" onclick="abrir('${d.id}')">
    <div class="flex items-center gap-2">
      <span class="${t.pill} h-[22px] text-[11px]">${t.l}</span>
      ${d.horas > 48 ? '<span class="pill-wait h-[22px] text-[11px]">+48 h</span>' : ""}
      ${d.bloqueo ? '<span class="pill-bad h-[22px] text-[11px]">Bloqueada</span>' : ""}
      <span class="ml-auto text-[15px] font-semibold num">${d.monto != null ? fmt(d.monto) : ""}</span>
    </div>
    <p class="text-[14.5px] font-semibold leading-tight">${d.titulo}</p>
    <p class="meta leading-snug">${d.sub}</p>
    <div class="flex items-center gap-1.5 pt-1 text-[11.5px] text-ink-light">
      ${av(d.por, "w-5 h-5 text-[8.5px]")}<span>${P[d.por].n.split(" ")[0]} · ${d.hace}</span>
      ${revisado ? `<span class="ml-auto text-violet-700 font-medium">✓ Revisó ${P[d.revisor].n.split(" ")[0]}</span>` : ""}
      ${d.cambio ? '<span class="ml-auto text-amber-700 font-medium">Cambió tras enviarse</span>' : ""}
    </div>
  </div>`;
}

function lineaTiempo(d, todo) {
  const items = todo ? d.actividad : d.actividad.slice(-3);
  const resto = d.actividad.length - items.length;
  return `
    ${resto > 0 ? `<button class="text-[12.5px] text-brand-600 font-medium mb-2" onclick="S.verTodo=true;render()">Ver ${resto} eventos anteriores</button>` : ""}
    <div class="relative">
      <div class="absolute left-[13px] top-2 bottom-2 w-px bg-surface-border"></div>
      ${items.map(([who, k, txt, cuando, cita]) => `
        <div class="relative flex gap-3 pb-3.5 last:pb-0">
          <span class="avatar ${ACT[k][1]} text-[12px] z-10 ring-4 ring-white">${ACT[k][0]}</span>
          <div class="min-w-0 flex-1 pt-0.5">
            <p class="text-[12.5px] leading-snug"><b class="font-semibold">${P[who].n}</b> ${txt}</p>
            ${cita ? `<p class="mt-1 text-[12.5px] leading-snug rounded-lg px-3 py-2 ${k === "devuelto" ? "bg-red-50 text-red-900" : k === "aprobado" ? "bg-emerald-50 text-emerald-900" : "bg-surface-raised text-ink"}">${cita}</p>` : ""}
            <p class="text-[11px] text-ink-light mt-0.5">${cuando}</p>
          </div>
        </div>`).join("")}
    </div>`;
}

function cajaComentario() {
  return `<div class="flex items-center gap-2 mt-3">
    ${av("dir")}<input class="field h-10 rounded-full text-[13px]" placeholder="Escribe un comentario… (@ para mencionar)">
  </div>`;
}

function detalleCuerpo(d) {
  const t = TIPOS[d.tipo];
  return `
    <div class="px-5 pt-4 pb-5 bg-white border-b border-surface-border">
      <div class="flex items-center gap-2"><span class="${t.pill}">${t.l}</span><span class="text-[11.5px] text-ink-light font-mono truncate">${d.folio}</span></div>
      <p class="text-[22px] font-semibold tracking-tight mt-2 leading-tight">${d.titulo}</p>
      ${d.monto != null ? `<p class="text-[28px] font-semibold num tracking-tight mt-0.5">${fmt(d.monto)}</p>` : ""}
      <p class="meta mt-1">${d.ctx}</p>
      <div class="flex items-center gap-1.5 mt-3 text-[12px] text-ink-muted">
        ${av(d.por, "w-5 h-5 text-[8.5px]")} Envió ${P[d.por].n} · ${d.hace}
        ${d.revisor ? `<span class="text-ink-xlight">·</span><span class="text-violet-700">✓ revisó ${P[d.revisor].n.split(" ")[0]}</span>` : ""}
      </div>
    </div>
    <div class="px-4 py-4 space-y-4">
      ${alertaHtml(d.alerta)}
      ${d.cambio ? alertaHtml(["wait","Cambió después de enviarse: Merma de gabardina 3 % → 5 %. Ver la actividad."]) : ""}
      <div class="panel divide-y divide-surface-border">
        ${d.resumen.map(([k, v]) => `<div class="flex items-start justify-between gap-4 px-4 py-2.5"><span class="meta">${k}</span><span class="text-[13px] font-medium text-right num">${v}</span></div>`).join("")}
      </div>
      ${d.renglones.length ? `
        <details class="panel group">
          <summary class="px-4 h-11 flex items-center justify-between cursor-pointer list-none text-[13px] font-medium">Renglones (${d.renglones.length})<span class="text-ink-light group-open:rotate-90 transition">›</span></summary>
          <div class="border-t border-surface-border">${d.renglones.map(r => `
            <div class="px-4 py-2.5 border-b border-surface-border last:border-0">
              <p class="text-[13px] font-medium">${r[0]}</p>
              <p class="meta num flex justify-between"><span>${r[1]}${r[2] ? " × " + r[2] : ""}</span><span class="text-ink font-medium">${r[3]}</span></p>
            </div>`).join("")}</div>
        </details>` : ""}
      ${d.adjuntos.length ? `<div class="flex flex-wrap gap-2">${d.adjuntos.map(a => `<span class="chip inline-flex items-center gap-1.5">${ICON.clip}${a}</span>`).join("")}</div>` : ""}
      <div>
        <p class="eyebrow mb-3">Actividad</p>
        <div class="panel p-4">${lineaTiempo(d, S.verTodo)}${cajaComentario()}</div>
      </div>
    </div>`;
}

function accionesDetalle(d) {
  if (S.esc === "revisor") return `
    <button class="btn-danger h-12 flex-1 text-[14px]" onclick="hoja('regresar')">Regresar</button>
    <button class="btn-primary h-12 flex-[1.4] text-[14px] bg-violet-600 hover:bg-violet-700" onclick="revisar()">Marcar revisado</button>`;
  return `
    <button class="btn-danger h-12 flex-1 text-[14px]" onclick="hoja('regresar')">Regresar</button>
    <button class="btn-primary h-12 flex-[1.4] text-[14px]" ${d.bloqueo ? "disabled" : ""} onclick="${d.monto >= 100000 ? "hoja('confirmar')" : "aprobar()"}">${d.bloqueo ? "No se puede aprobar" : "Aprobar"}</button>`;
}

/* ═════════════ Pantallas del celular ═════════════ */
function encabezado(titulo, sub) {
  const notif = S.esc === "empleado" ? (S.empEstado === "devuelto" ? 1 : 0) : bandeja().length ? 3 : 0;
  return `<div class="bg-white px-5 pt-2 pb-4 border-b border-surface-border">
    <div class="flex items-center justify-between">
      <p class="eyebrow">${S.esc === "revisor" ? "Revisión de documentos" : S.esc === "empleado" ? "Costeo Yelke" : "Dirección"}</p>
      <button class="relative w-10 h-10 -mr-2 flex items-center justify-center text-ink-muted" onclick="hoja('notif')">${ICON.bell}
        ${notif ? `<span class="absolute top-1.5 right-1.5 min-w-[17px] h-[17px] px-1 rounded-full bg-brand-500 text-white text-[10px] font-bold flex items-center justify-center">${notif}</span>` : ""}</button>
    </div>
    <h1 class="text-[24px] font-semibold tracking-tight leading-tight">${titulo}</h1>
    ${sub ? `<p class="lede mt-0.5">${sub}</p>` : ""}
  </div>`;
}

function bannerDeleg() {
  if (!S.deleg || S.esc !== "ceo") return "";
  return `<div class="mx-4 mt-3 rounded-xl bg-violet-50 border border-violet-200 px-3.5 py-2.5 flex items-center gap-3">
    ${av(S.deleg.a)}<p class="text-[12.5px] text-violet-900 flex-1 leading-snug"><b>${P[S.deleg.a].n}</b> aprueba por ti del ${S.deleg.desde} al ${S.deleg.hasta}.</p>
    <button class="text-[12.5px] font-semibold text-violet-700" onclick="S.deleg=null;toast('Delegación terminada. Vuelves a recibir todo.');">Terminar</button>
  </div>`;
}

function pantallaAprobar() {
  const lista = bandeja().filter(d => S.filtro === "todos" || GRUPO[d.tipo] === S.filtro);
  const n = bandeja().length, viejos = bandeja().filter(d => d.horas > 48).length;
  const esRev = S.esc === "revisor";
  const sub = n ? `${n} por ${esRev ? "revisar" : "aprobar"}${viejos ? ` · ${viejos} lleva más de 48 h` : ""}` : "";
  return `${encabezado(esRev ? "Por revisar" : "Buenos días", esRev ? "Revisas antes de que llegue a Dirección." : sub)}
    ${bannerDeleg()}
    ${!esRev ? `<div class="px-4 pt-3 flex gap-2 overflow-x-auto" style="scrollbar-width:none">${FILTROS.map(([k, l]) => {
      const c = k === "todos" ? n : bandeja().filter(d => GRUPO[d.tipo] === k).length;
      return `<button class="chip ${S.filtro === k ? "on" : ""}" onclick="S.filtro='${k}';render()">${l}${c ? " · " + c : ""}</button>`; }).join("")}</div>` : ""}
    <div class="px-4 py-3 space-y-2.5">
      ${lista.length ? lista.sort((a, b) => b.horas - a.horas).map(d => tarjeta(d)).join("") : `
        <div class="text-center py-14"><p class="text-[34px]">✓</p><p class="text-[15px] font-semibold mt-1">Todo al día</p><p class="meta">No tienes nada pendiente${S.filtro !== "todos" ? " en este filtro" : ""}.</p></div>`}
    </div>
    ${!esRev && esperandoRevision().length ? `
      <details class="mx-4 mb-3">
        <summary class="list-none cursor-pointer meta flex items-center gap-2 h-9"><span class="dot dot-off"></span>Esperando revisión antes de llegarte (${esperandoRevision().length}) ›</summary>
        <div class="space-y-2 mt-1 opacity-70">${esperandoRevision().map(d => `<div class="panel px-4 py-2.5 flex items-center gap-3"><div class="flex-1 min-w-0"><p class="text-[13px] font-medium truncate">${TIPOS[d.tipo].l} · ${d.titulo}</p><p class="meta">${d.hace} · la revisa ${P.luis.n.split(" ")[0]}</p></div><span class="num text-[13px]">${fmt(d.monto)}</span></div>`).join("")}</div>
      </details>` : ""}
    ${S.resueltos.length ? `
      <details class="mx-4 mb-6">
        <summary class="list-none cursor-pointer meta flex items-center gap-2 h-9"><span class="dot dot-ok"></span>Resueltos hoy (${S.resueltos.length}) ›</summary>
        <div class="space-y-2 mt-1">${S.resueltos.map(r => `<div class="panel px-4 py-2.5 flex items-center gap-3"><div class="flex-1 min-w-0"><p class="text-[13px] font-medium truncate">${TIPOS[r.d.tipo].l} · ${r.d.titulo}</p><p class="meta">${r.txt}</p></div><span class="${r.ok ? "pill-ok" : "pill-bad"}">${r.ok ? (r.rev ? "Revisado" : "Aprobado") : "Regresado"}</span></div>`).join("")}</div>
      </details>` : ""}`;
}

function pasosProyecto(p) {
  return `<div class="flex items-center gap-1 mt-3">${ETAPAS.map((e, i) => {
    const st = i + 1 < p.etapa || p.etapa === 6 ? "bg-emerald-500" : i + 1 === p.etapa ? (p.alerta && p.alerta[0] === "bad" ? "bg-red-500" : "bg-brand-500") : "bg-zinc-200";
    return `<span class="h-1.5 flex-1 rounded-full ${st}"></span>`; }).join("")}</div>
    <p class="text-[11.5px] text-ink-muted mt-1.5">${p.etapa === 6 ? "Completado · entregado y facturado" : "Va en <b class='text-ink font-medium'>" + ETAPAS[p.etapa - 1] + "</b> · paso " + p.etapa + " de 6"}</p>`;
}

function pantallaProyectos() {
  const lista = PROYECTOS.filter(p => p.grupo === S.provFiltro);
  const c = (g) => PROYECTOS.filter(p => p.grupo === g).length;
  return `${encabezado("Proyectos", `${c("activos") + c("atrasados")} en curso · ${c("atrasados")} atrasados`)}
    ${bannerDeleg()}
    <div class="px-4 pt-3"><div class="seg w-full grid grid-cols-3">
      ${[["activos","Activos"],["atrasados","Atrasados"],["completados","Completados"]].map(([k, l]) => `<button class="justify-center ${S.provFiltro === k ? "on" : ""}" onclick="S.provFiltro='${k}';render()">${l} · ${c(k)}</button>`).join("")}
    </div></div>
    <div class="px-4 py-3 space-y-2.5">${lista.map(p => `
      <div class="card">
        <div class="flex items-start gap-3">
          <div class="flex-1 min-w-0"><p class="text-[14.5px] font-semibold leading-tight">${p.t}</p><p class="meta truncate">${p.c} · ${p.ov}</p></div>
          <div class="text-right"><p class="text-[14px] font-semibold num">${fmtC(p.monto)}</p><p class="text-[11px] text-ink-light">entrega ${p.entrega}</p></div>
        </div>
        ${pasosProyecto(p)}
        <div class="flex items-center gap-2 mt-2.5">
          <div class="flex-1 h-1 bg-zinc-100 rounded"><div class="h-1 rounded ${p.prod[0] === p.prod[1] ? "bg-emerald-500" : "bg-sky-500"}" style="width:${Math.round(p.prod[0] / p.prod[1] * 100)}%"></div></div>
          <span class="text-[11.5px] text-ink-muted num">${p.prod[0].toLocaleString("es-MX")} / ${p.prod[1].toLocaleString("es-MX")} ${p.prod[1] < 50 ? "encargos" : "prendas"}</span>
        </div>
        ${p.alerta ? `<div class="mt-2.5">${alertaHtml(p.alerta)}</div>` : ""}
      </div>`).join("") || '<p class="meta text-center py-10">Nada aquí.</p>'}</div>`;
}

function pantallaResumen() {
  const kpi = (l, v, s, w) => `<div class="bg-white p-4"><p class="meta">${l}</p><p class="text-[21px] font-semibold num mt-0.5 tracking-tight">${v}</p>${s ? `<p class="text-[11.5px] text-ink-muted mt-0.5">${s}</p>` : ""}${w != null ? `<div class="h-1 bg-zinc-100 rounded mt-2"><div class="h-1 bg-brand-500 rounded" style="width:${w}%"></div></div>` : ""}</div>`;
  return `${encabezado("Resumen", "Octubre 2026 · YELKE PRUEBAS")}
    ${bannerDeleg()}
    <div class="px-4 py-4 space-y-4">
      <div class="grid grid-cols-2 gap-px bg-surface-border rounded-xl overflow-hidden border border-surface-border">
        ${kpi("Vendido", fmtC(2611787.5), "9 órdenes · 7,010 prendas")}
        ${kpi("Facturado", fmtC(1674630), "64 % de lo vendido", 64)}
        ${kpi("Cotizado", fmtC(3187150), "82 % se convirtió en venta", 82)}
        ${kpi("Margen promedio", "45.0 %", "de los costeos validados")}
        ${kpi("Compras de material", fmtC(543347.42), "")}
        ${kpi("Maquila", fmtC(447600), "17 de 23 encargos recibidos", 74)}
      </div>
      <div>
        <p class="eyebrow mb-2">Requiere tu atención</p>
        <div class="panel divide-y divide-surface-border">
          ${[["dot-wait", bandeja().length + " documentos por aprobar", "aprobar"], ["dot-bad", "2 proyectos con entrega vencida", "proyectos"], ["dot-wait", "1 orden de venta bloqueada: falta la OC del cliente", "aprobar"]]
            .map(([d, t, tab]) => `<button class="w-full text-left px-4 h-12 flex items-center gap-3 text-[13px]" onclick="S.tab='${tab}';${tab === "proyectos" ? "S.provFiltro='atrasados';" : ""}render()"><span class="dot ${d}"></span><span class="flex-1">${t}</span><span class="text-ink-light">›</span></button>`).join("")}
        </div>
      </div>
      <div class="panel p-4">
        ${S.deleg ? `
          <p class="text-[14px] font-semibold">Delegación activa</p>
          <p class="meta mt-0.5">${P[S.deleg.a].n} aprueba por ti del ${S.deleg.desde} al ${S.deleg.hasta}. Termina sola.</p>
          <button class="btn-secondary w-full h-11 mt-3" onclick="S.deleg=null;toast('Delegación terminada. Vuelves a recibir todo.')">Terminar ahora</button>` : `
          <p class="text-[14px] font-semibold">¿Vas a salir unos días?</p>
          <p class="meta mt-0.5">Deja a alguien aprobando por ti. Se termina sola en la fecha que elijas.</p>
          <button class="btn-primary w-full h-11 mt-3" onclick="hoja('delegar')">Delegar mis aprobaciones</button>`}
      </div>
      <p class="text-[11px] text-ink-light text-center pb-2">Las cifras salen de <code>dashboard_metrics</code>, el mismo cálculo de Inicio.</p>
    </div>`;
}

    <div class="px-4 py-4 space-y-4">

        <div class="rounded-xl bg-amber-50 border border-amber-300 p-4">

/* ═════════════ Hojas (bottom sheets) ═════════════ */
function hojaHtml() {
  const d = S.doc && doc(S.doc);
  if (S.sheet === "regresar") {
    const quien = S.esc === "revisor" ? P[d.por].n : P[d.por].n;
    const motivos = ["Falta un adjunto","Precio incorrecto","Cantidad incorrecta","Pide otra cotización"];
    return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-2 pb-3"><p class="text-[17px] font-semibold">Regresar a corregir</p><p class="meta mt-0.5">Le llega a <b>${quien}</b> en la campana y por correo. El documento no se borra: sigue en borrador para que lo corrija.</p></div>
      <div class="px-5 flex gap-2 flex-wrap">${motivos.map(m => `<button class="chip" onclick="S.motivo=(S.motivo? S.motivo+' ' : '')+'${m}.';hojaRefrescar()">${m}</button>`).join("")}</div>
      <div class="px-5 pt-3">
        <label class="field-label">¿Qué tiene que corregir? <span class="text-red-600">*</span></label>
        <textarea id="motivo" rows="4" class="field h-auto py-2.5 leading-snug" placeholder="Ej. Pide a FILAFIL precio por volumen: son 930 m." oninput="S.motivo=this.value;$('#btn-reg').disabled=this.value.trim().length<5">${S.motivo}</textarea>
        <p class="text-[11px] text-ink-light mt-1">Obligatorio · queda en la actividad del documento.</p>
      </div>
      <div class="px-5 pt-4 flex gap-2">
        <button class="btn-secondary h-12 flex-1" onclick="hoja(null)">Cancelar</button>
        <button id="btn-reg" class="btn h-12 flex-[1.4] bg-red-600 text-white hover:bg-red-700" ${S.motivo.trim().length < 5 ? "disabled" : ""} onclick="regresar()">Regresar a ${quien.split(" ")[0]}</button>
      </div></div>`;
  }
  if (S.sheet === "confirmar") return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-3 text-center"><p class="text-[13px] text-ink-muted">${TIPOS[d.tipo].l} · ${d.titulo}</p><p class="text-[30px] font-semibold num tracking-tight mt-1">${fmt(d.monto)}</p>
        <p class="meta mt-1">Al aprobarla se valida en ERPNext y se le avisa a ${P[d.por].n}.</p></div>
      <div class="px-5 pt-3"><input class="field" placeholder="Comentario opcional"></div>
      <div class="px-5 pt-4 flex gap-2"><button class="btn-secondary h-12 flex-1" onclick="hoja(null)">Cancelar</button><button class="btn-primary h-12 flex-[1.4]" onclick="aprobar()">Sí, aprobar</button></div></div>`;
  if (S.sheet === "delegar") return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-2 pb-2"><p class="text-[17px] font-semibold">Delegar mis aprobaciones</p><p class="meta mt-0.5">Esa persona podrá aprobar y regresar documentos en tu lugar. No verá Proyectos ni Resumen.</p></div>
      <div class="px-5 space-y-3 overflow-y-auto">
        <div><label class="field-label">¿Quién aprueba por ti?</label>
          <div class="space-y-1.5">${["luis","jorge","mariana"].map(k => `<label class="flex items-center gap-3 panel px-3 h-12 cursor-pointer has-[:checked]:border-brand-400 has-[:checked]:bg-brand-50/50"><input type="radio" name="dlg" value="${k}" class="accent-brand-500" ${k === "luis" ? "checked" : ""}>${av(k)}<span class="text-[13.5px] font-medium flex-1">${P[k].n}</span><span class="meta">${P[k].rol}</span></label>`).join("")}</div></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="field-label">Desde</label><input type="date" class="field" id="dl-desde" value="2026-10-20"></div>
          <div><label class="field-label">Hasta</label><input type="date" class="field" id="dl-hasta" value="2026-10-30"></div>
        </div>
        <div><label class="field-label">Motivo (opcional)</label><input class="field" placeholder="Vacaciones"></div>
        <p class="text-[12px] text-ink-muted bg-surface-raised rounded-lg px-3 py-2">Se termina sola el día “Hasta”. Mientras dure, los avisos te siguen llegando a ti también.</p>
      </div>
      <div class="px-5 pt-4 flex gap-2"><button class="btn-secondary h-12 flex-1" onclick="hoja(null)">Cancelar</button><button class="btn-primary h-12 flex-[1.4]" onclick="delegar()">Delegar</button></div></div>`;
  if (S.sheet === "notif") {
    const items = S.esc === "empleado" ? [["dir","te regresó la OC PUR-ORD-2026-00344: “" + (S.motivo || "Pide a FILAFIL precio por volumen: son 930 m.") + "”","hace 3 min",true]]
      : S.esc === "revisor" ? [["ana","envió a revisión la OC a taller de JESUS MOLINA TAPIA · $54,810.00","hace 40 min",true]]
      : [["luis","revisó la OC de GRUPO FILAFIL · $70,122.00. Ya puedes aprobarla.","hace 2 h",true],["mariana","envió 2 precios acordados de FERROCARRIL MEXICANO","hace 2 h",true],["sofia","envió la factura de PAQUETERIA PRUEBA UNO · $1,120.00","hace 6 h",true],["mariana","Recordatorio: la cotización SAL-QTN-2026-00017 espera tu aprobación desde hace 3 días","hoy 8:00",false]];
    return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-2 pb-2 flex items-center justify-between"><p class="text-[17px] font-semibold">Notificaciones</p><button class="text-[12.5px] text-brand-600 font-medium">Marcar leídas</button></div>
      <div class="overflow-y-auto">${items.map(([w, t, h, nuevo]) => `<button class="w-full text-left px-5 py-3 flex gap-3 border-b border-surface-border ${nuevo ? "bg-brand-50/40" : ""}" onclick="hoja(null);${S.esc === "empleado" ? "" : `abrir('${S.esc === "revisor" ? "maq1" : "oc1"}')`}">${av(w)}<div class="flex-1"><p class="text-[13px] leading-snug"><b>${P[w].n}</b> ${t}</p><p class="text-[11px] text-ink-light mt-0.5">${h}</p></div>${nuevo ? '<span class="dot dot-now mt-2"></span>' : ""}</button>`).join("")}</div>
      ${S.esc === "empleado" ? `<div class="px-5 pt-3"><button class="btn-secondary w-full h-11" onclick="hoja('correo')">Ver el correo que le llega</button></div>` : `<div class="px-5 pt-3"><button class="btn-secondary w-full h-11" onclick="hoja('correo')">Ver el correo de aviso</button></div>`}
    </div>`;
  }
  if (S.sheet === "correo") {
    const emp = S.esc === "empleado";
    return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-1 pb-2"><p class="meta">Correo · de erp.yelke.com.mx</p><p class="text-[15px] font-semibold mt-0.5">${emp ? "Te regresaron la OC PUR-ORD-2026-00344 para corregir" : "Por aprobar: OC de GRUPO FILAFIL · $70,122.00"}</p></div>

                : `<p>Luis Ortega revisó la orden de compra <b>PUR-ORD-2026-00344</b> y ya espera tu aprobación.</p><p class="meta">GRUPO FILAFIL · Gabardina naranja 930 m · Lote 2 · $70,122.00</p>`}
          <button class="btn-primary w-full h-11 mt-2">${emp ? "Abrir y corregir" : "Abrir en el panel"}</button>

  if (S.sheet === "reenviar") return `<div class="sheet"><div class="grab"></div>
      <div class="px-5 pt-2"><p class="text-[17px] font-semibold">Reenviar a aprobación</p><p class="meta mt-0.5">Le llega a Luis Ortega (revisión) y después a Dirección.</p></div>

}

/* ═════════════ Armado del celular ═════════════ */
function celular() {
  const d = S.doc && doc(S.doc);
  const esRev = S.esc === "revisor", esEmp = S.esc === "empleado";
  let cuerpo, barra = "";
  if (esEmp) {
    cuerpo = pantallaEmpleado();
    barra = S.empEstado === "devuelto"
      ? `<div class="flex-shrink-0 bg-white border-t border-surface-border px-4 pt-3 flex gap-2" style="padding-bottom:26px"><button class="btn-secondary h-12 flex-1">Editar la OC</button><button class="btn-primary h-12 flex-[1.4]" onclick="hoja('reenviar')">Ya lo corregí · Reenviar</button></div>` : "";
  } else if (d) {
    cuerpo = `<div class="overlay">
      <div class="bg-white h-12 flex items-center px-2 border-b border-surface-border flex-shrink-0">
        <button class="h-10 px-2 flex items-center gap-0.5 text-brand-600 text-[14px] font-medium" onclick="cerrar()">${ICON.back}${esRev ? "Por revisar" : "Por aprobar"}</button>
      </div>
      <div class="scr">${detalleCuerpo(d)}</div>
      <div class="flex-shrink-0 bg-white border-t border-surface-border px-4 pt-2.5" style="padding-bottom:26px">
        ${d.bloqueo ? `<p class="text-center text-[11.5px] text-red-700 mb-2">${d.bloqueo}: ${P[d.por].n.split(" ")[0]} tiene que adjuntarla.</p>` : ""}
        <div class="flex gap-2">${accionesDetalle(d)}</div>
      </div>
    </div>`;
  } else {
    cuerpo = S.tab === "aprobar" ? pantallaAprobar() : S.tab === "proyectos" ? pantallaProyectos() : pantallaResumen();
  }
  const tabs = esRev || esEmp ? [] : [["aprobar","Por aprobar", ICON.aprobar, bandeja().length],["proyectos","Proyectos", ICON.proyectos, 2],["resumen","Resumen", ICON.resumen, 0]];
  return `<div class="phone"><div class="phone-notch"></div>
    <div class="phone-status"><span>9:41</span><span class="tracking-widest">●●● ▮</span></div>
    <div class="scr relative">${d && !esEmp ? "" : cuerpo}</div>
    ${d && !esEmp ? cuerpo : ""}
    ${barra}
    ${tabs.length && !d ? `<div class="tabbar grid-cols-3">${tabs.map(([k, l, ic, c]) => `<button class="${S.tab === k ? "on" : ""} relative" onclick="S.tab='${k}';render()">${ic}${l}${c ? `<span class="absolute top-1.5 left-[calc(50%+6px)] min-w-[16px] h-4 px-1 rounded-full ${k === "proyectos" ? "bg-red-500" : "bg-brand-500"} text-white text-[9.5px] font-bold flex items-center justify-center">${c}</span>` : ""}</button>`).join("")}</div>`
      : esRev && !d ? `<div class="flex-shrink-0 bg-white border-t border-surface-border text-center meta" style="padding:10px 0 26px">Solo ves lo que te toca revisar.</div>` : ""}
    ${S.sheet ? `<div class="sheet-scrim" onclick="hoja(null)"></div>${hojaHtml()}` : ""}
    ${S.toast ? `<div class="toast"><span>✓</span><span class="flex-1">${S.toast}</span></div>` : ""}
  </div>`;
}

/* ═════════════ Escritorio ═════════════ */
function escritorio() {
  const lista = bandeja().sort((a, b) => b.horas - a.horas);
  if (!doc(S.deskSel) || !lista.find(x => x.id === S.deskSel)) S.deskSel = lista[0] && lista[0].id;
  const d = S.deskSel && doc(S.deskSel);
  const nav = [["Inicio"],["Dirección", bandeja().length, true],["Proyectos"],["Plantillas"],["—Documentos"],["Cotizaciones"],["Órdenes de Venta"],["Órdenes de Compra"],["Facturas de Compra"]];
  return `<div class="desk">
    <aside class="w-52 bg-white border-r border-surface-border px-2 py-3 flex-shrink-0">
      <div class="flex items-center gap-2.5 px-2 h-10 mb-3"><span class="w-7 h-7 rounded-md bg-brand-500 text-white text-[12px] font-bold flex items-center justify-center">Y</span><div><p class="text-[13px] font-semibold leading-none">Costeo</p><p class="text-[10px] text-ink-muted">Yelke</p></div></div>
      ${nav.map(([l, c, on]) => l.startsWith("—") ? `<p class="eyebrow px-2.5 pt-4 pb-1">${l.slice(1)}</p>` : `<div class="nav-item ${on ? "on" : ""}">${l}${c ? `<span class="ml-auto text-[10.5px] font-semibold text-white bg-brand-500 rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center">${c}</span>` : ""}</div>`).join("")}
    </aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <div class="h-14 bg-white border-b border-surface-border flex items-center px-6 gap-4 flex-shrink-0">
        <div><p class="eyebrow">Dirección</p><p class="text-[16px] font-semibold leading-tight">Por aprobar</p></div>
        <div class="seg ml-6"><button class="on">Por aprobar · ${lista.length}</button><button>Proyectos</button><button>Resumen</button></div>
        <button class="btn-secondary ml-auto h-8 text-[12.5px]">Delegar…</button>
        <span class="relative text-ink-muted">${ICON.bell}<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-brand-500 text-white text-[9.5px] font-bold flex items-center justify-center">3</span></span>
      </div>
      <div class="flex-1 flex min-h-0">
        <div class="w-[400px] border-r border-surface-border flex flex-col bg-white flex-shrink-0">
          <div class="px-4 py-2.5 flex gap-2 border-b border-surface-border">${FILTROS.map(([k, l]) => `<button class="chip h-7 text-[12px] ${k === "todos" ? "on" : ""}">${l}</button>`).join("")}</div>
          <div class="overflow-y-auto flex-1">${lista.map(x => `
            <div class="row ${x.id === S.deskSel ? "sel" : ""}" onclick="S.deskSel='${x.id}';S.verTodo=false;render()">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2"><span class="${TIPOS[x.tipo].pill} h-5 text-[10.5px]">${TIPOS[x.tipo].l}</span>${x.horas > 48 ? '<span class="pill-wait h-5 text-[10.5px]">+48 h</span>' : ""}${x.bloqueo ? '<span class="pill-bad h-5 text-[10.5px]">Bloqueada</span>' : ""}</div>
                <p class="text-[13.5px] font-semibold mt-1 truncate">${x.titulo}</p>
                <p class="meta truncate">${x.sub}</p>
                <p class="text-[11px] text-ink-light mt-0.5">${P[x.por].n} · ${x.hace}${x.revisor ? ` · <span class="text-violet-700">✓ revisó ${P[x.revisor].n.split(" ")[0]}</span>` : ""}</p>
              </div>
              <span class="text-[13.5px] font-semibold num self-start">${x.monto != null ? fmt(x.monto) : ""}</span>
            </div>`).join("")}</div>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          ${d ? `<div class="flex-1 overflow-y-auto"><div class="max-w-[640px]">${detalleCuerpo(d)}</div></div>
            <div class="h-16 bg-white border-t border-surface-border flex items-center px-6 gap-3 flex-shrink-0">
              <span class="dot ${d.bloqueo ? "dot-bad" : "dot-now"}"></span><span class="meta flex-1">${d.bloqueo ? d.bloqueo : "Al aprobar se valida en ERPNext y se avisa a " + P[d.por].n}</span>
              <button class="btn-danger" onclick="S.doc='${d.id}';S.motivo='';hoja('regresar')">Regresar…</button>
              <button class="btn-primary" ${d.bloqueo ? "disabled" : ""} onclick="S.doc='${d.id}';${d.monto >= 100000 ? "hoja('confirmar')" : "aprobar()"}">Aprobar</button>
            </div>` : `<div class="m-auto text-center"><p class="text-[34px]">✓</p><p class="font-semibold">Todo al día</p></div>`}
        </div>
      </div>
    </div>
    ${S.sheet ? `<div class="absolute inset-0 z-40 bg-black/30 flex items-center justify-center" onclick="if(event.target===this)hoja(null)"><div class="w-[460px]">${hojaHtml()}</div></div>` : ""}
    ${S.toast ? `<div class="toast"><span>✓</span><span class="flex-1">${S.toast}</span></div>` : ""}
  </div>`;
}

/* ═════════════ Notas para revisar el mockup ═════════════ */
const NOTAS = {
  ceo: ["Lo que ve el CEO en el celular", [
    "<b>Por aprobar</b> es lo primero que ve. Las tarjetas van de la que más espera a la más nueva, y hay filtros por área.",
    "Prueba <b>GRUPO FILAFIL</b>: la revisó Luis (esquema Doble). Ábrela y toca <b>Regresar</b>: el comentario es obligatorio. Luego cambia a <i>Celular · Empleado</i> para ver lo que le llega a Ana.",
    "La <b>Orden de venta</b> sale <b>bloqueada</b>, como en el sandbox real: la SAL-ORD-2026-00018 no tiene adjunta la OC del cliente.",
    "Montos de $100 k o más piden confirmación antes de aprobar.",
    "<b>Proyectos → Atrasados</b>: los costeos 00027 y 00028 tenían entrega el 8-oct y no han entregado nada (dato real).",
    "<b>Resumen → Delegar mis aprobaciones</b>: el flujo de vacaciones. Al activarlo aparece la franja morada en todas las pestañas.",
    "Abajo de la bandeja hay dos listas: lo que todavía <b>espera revisión</b> (la OC a taller) y lo que ya resolviste hoy."]],
  revisor: ["Lo que ve el revisor", [
    "Solo una lista: lo que le toca revisar (esquema Doble: las OC). No ve Proyectos ni Resumen.",
    "Sus botones son <b>Regresar</b> y <b>Marcar revisado</b>. Al marcarla, pasa a la bandeja del CEO y le llega el aviso.",
    "Si un revisor recibe una delegación, ve esta misma pantalla, pero con <b>Aprobar</b>."]],
  empleado: ["Lo que ve quien capturó el documento", [
    "Cuando le regresan algo, le llega a la <b>campana</b> (en tiempo real) y por <b>correo</b>. Toca la campana para verlos.",
    "Dentro del documento sale arriba la <b>franja ámbar</b> con el comentario de quien lo regresó, y el botón <b>Ya lo corregí · Reenviar</b>.",
    "La <b>Actividad</b> es la misma línea de tiempo de ERPNext (creación, cambios, adjuntos, comentarios, envíos, revisiones). Va en todos los documentos de la app.",
    "Si escribiste un motivo al regresar la OC en el escenario del CEO, aquí aparece ese mismo texto."]],
  desk: ["Escritorio (≥ 1024 px)", [
    "Es la misma información en dos columnas: la lista a la izquierda y el detalle fijo a la derecha. La barra de acciones va abajo, como en Producción.",
    "Entra desde el menú lateral normal de la app (<b>Dirección</b>, con contador). Para quien tiene el rol Director, es su pantalla de inicio.",
    "Proyectos y Resumen son las mismas vistas del celular, pero a lo ancho."]],
};
function notas() {
  const [t, items] = NOTAS[S.esc];
  return `<div class="panel p-5"><p class="eyebrow">Cómo revisar este escenario</p><p class="text-[15px] font-semibold mt-1">${t}</p>
    <ul class="mt-3 space-y-2.5 text-[12.5px] leading-relaxed text-ink-muted list-disc pl-4">${items.map(i => `<li>${i}</li>`).join("")}</ul></div>
    <div class="note">Mockup v1 con datos reales de sandbox.local (folios, montos, clientes y proveedores). Los nombres de personas son ilustrativos. Plan: <code>docs/plan-panel-direccion.md</code>.</div>
    <div class="panel p-4 text-[12px] text-ink-muted leading-relaxed"><p class="font-semibold text-ink mb-1">Se oculta en celular</p>Las columnas secundarias de los renglones (quedan detrás de “Renglones”), la actividad completa (se ven los últimos 3 eventos) y las gráficas (quedan los indicadores). Abre este archivo en tu teléfono: el marco desaparece y se ve a pantalla completa.</div>`;
}

/* ═════════════ Acciones ═════════════ */
function abrir(id) { S.doc = id; S.verTodo = false; S.sheet = null; S.motivo = ""; render(); }
function cerrar() { S.doc = null; S.sheet = null; render(); }
function hoja(k) { S.sheet = k; if (k) S.toast = null; render(); if (k === "regresar") setTimeout(() => { const t = $("#motivo"); t && t.focus(); }, 50); }
function hojaRefrescar() { render(); }
let tt;
function toast(t) { S.toast = t; S.sheet = null; render(); clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 2600); }
function aprobar() {
  const d = doc(S.doc); d.estado = "aprobado";
  S.resueltos.unshift({ d, ok: true, txt: "se avisó a " + P[d.por].n.split(" ")[0] });
  S.doc = null; toast(`${TIPOS[d.tipo].l} aprobada. Le avisamos a ${P[d.por].n}.`);
}
function revisar() {
  const d = doc(S.doc); d.estado = "revisado"; d.revisor = "luis"; d.revHace = "ahora";
  d.actividad.push(["luis","revision","la revisó","ahora"]);
  S.resueltos.unshift({ d, ok: true, rev: true, txt: "pasó a Dirección" });
  S.doc = null; toast("Revisada. Ya está en la bandeja de Dirección.");
}
function regresar() {
  const d = doc(S.doc); d.estado = "devuelto";
  S.resueltos.unshift({ d, ok: false, txt: "“" + S.motivo.trim() + "”" });
  const quien = P[d.por].n;
  S.doc = null; toast(`Regresada a ${quien}. Le llegó el aviso con tu comentario.`);
}
function delegar() {
  const a = (document.querySelector('input[name="dlg"]:checked') || {}).value || "luis";
  const f = (v) => { const [y, m, dd] = v.split("-"); return `${+dd}-${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m - 1]}`; };
  S.deleg = { a, desde: f($("#dl-desde").value), hasta: f($("#dl-hasta").value) };
  toast(`${P[a].n} aprobará por ti del ${S.deleg.desde} al ${S.deleg.hasta}. Ya le avisamos.`);
}

function render() {
  document.querySelectorAll("#escenarios button").forEach(b => b.classList.toggle("on", b.dataset.esc === S.esc));
  $("#device").innerHTML = S.esc === "desk" ? escritorio() : celular();
  $("#notas").innerHTML = notas();
  $("#stage").classList.toggle("flex-col", S.esc === "desk");
  $("#stage").classList.toggle("items-center", S.esc === "desk");
  history.replaceState(null, "", "#" + S.esc);
}
document.querySelectorAll("#escenarios button").forEach(b => b.onclick = () => {
  const motivo = S.motivo; S.esc = b.dataset.esc; S.doc = null; S.sheet = null; S.toast = null;
  if (S.esc === "empleado") S.motivo = motivo || (S.resueltos.find(r => !r.ok && r.d.id === "oc1") || {}).txt?.replace(/[“”]/g, "") || "";
  render();
});
reiniciar((location.hash || "#ceo").slice(1) in NOTAS ? (location.hash || "#ceo").slice(1) : "ceo");
</script>
</body>

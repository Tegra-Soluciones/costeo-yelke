{% extends "templates/base.html" %}

{% block title %}Costeo Yelke{% endblock %}

{% block head_include %}
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body > .navbar,
  body > nav.navbar,
  section[data-section-template="Standard Navbar"],
  section[data-section-template="Primary Navbar"],
  body > .container.page-container,
  body > .page-container,
  footer.web-footer,
  footer.standard-footer { display: none !important; }
  body { overflow: hidden; margin: 0; padding: 0; }
</style>
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/assets/costeo_yelke/costeo-app/assets/index.css" />
{% endblock %}

{% block content %}
<div id="app" style="height:100vh;overflow:hidden;"></div>
{% endblock %}

{% block footer %}{% endblock %}

{% block script %}
<script type="module" src="/assets/costeo_yelke/costeo-app/assets/index.js"></script>
{% endblock %}
